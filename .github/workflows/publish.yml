name: Publish packages

# Publishes @akita-protocol/sdk and @akita-protocol/plugin to npm.
#
# Push a tag named after the package and the version in its package.json:
#   sdk-v1.4.12     -> projects/akita-sdk
#   plugin-v1.0.0   -> projects/akita-plugin
# A prerelease goes out under its own dist-tag (1.5.0-canary.1 -> `canary`), so `latest` only
# moves for a plain release. Run it by hand from the Actions tab to rehearse with a dry run, or to
# pick the dist-tag yourself.
#
# The SDK's dist/ is committed and published as is (as `npm run publish:canary` always has), so
# rebuild and commit dist/ before tagging a new SDK version.
#
# Publishes through npm trusted publishing (OIDC), so there is no npm token to keep. Each package
# needs a GitHub Actions trusted publisher on npmjs.com: organization akita-protocol, repository
# akita-sc, workflow publish.yml. npm only takes one for a package that already exists, so for a
# package's very first version put a short-lived npm token in the NPM_TOKEN secret for that one run
# (npm tries OIDC first and falls back to it), then delete the secret and the token.

on:
  push:
    tags: ["sdk-v*", "plugin-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        options: [sdk, plugin]
        required: true
      dist-tag:
        description: "npm dist-tag (empty: from the version, e.g. canary for 1.5.0-canary.1)"
        required: false
        default: ""
      dry-run:
        description: "Pack and check only, publish nothing"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Resolve package and version
        id: pkg
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_TAG: ${{ inputs.dist-tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            pkg="${REF_NAME%%-v*}"
          else
            pkg="$INPUT_PACKAGE"
          fi
          case "$pkg" in
            sdk) dir=projects/akita-sdk ;;
            plugin) dir=projects/akita-plugin ;;
            *) echo "::error::Unknown package '$pkg'."; exit 1 ;;
          esac
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$pkg-v$version" ]; then
            echo "::error::Tag $REF_NAME does not match $name's version ($pkg-v$version)."
            exit 1
          fi
          if [ "$pkg" = "sdk" ] && [ ! -f "$dir/dist/index.js" ]; then
            echo "::error::$dir/dist is missing; build the SDK and commit dist/ first."
            exit 1
          fi
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            case "$version" in
              *-*) tag=$(echo "${version#*-}" | cut -d. -f1) ;;
              *) tag=latest ;;
            esac
          fi
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
            echo "dist-tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $name@$version under the '$tag' dist-tag."

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          # Empty unless a first publish needs it (see the top of this file).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          DIST_TAG: ${{ steps.pkg.outputs.dist-tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --tag "$DIST_TAG" --access public
          elif npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping."
          else
            npm publish --tag "$DIST_TAG" --access public --provenance
          fi
