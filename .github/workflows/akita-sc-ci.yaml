name: Validate akita-sc

# Two questions on every push and pull request:
#   1. Does a clean install and a whole-tree build reproduce the committed build output?
#      (deploy and update scripts send whatever is under smart_contracts/artifacts)
#   2. Does the whole suite pass against that output on a fresh LocalNet?
on:
  push:
    branches: [main, 'feat/**', 'release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: akita-sc-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Use the Node.js version in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Build every contract (whole tree)
        working-directory: projects/akita-sc
        run: npm run build

      - name: Build the SDK
        working-directory: projects/akita-sdk
        run: npm run build

      # dist/*.map is left out: tsup writes the absolute build path into each source map.
      - name: The build output in the repository is the output of this build
        run: |
          git add -N projects/akita-sc/smart_contracts/artifacts projects/akita-sdk/src/generated projects/akita-sdk/dist
          git diff --exit-code --stat -- \
            projects/akita-sc/smart_contracts/artifacts \
            projects/akita-sdk/src/generated \
            projects/akita-sdk/dist ':(exclude)projects/akita-sdk/dist/*.map'

      - name: The release manifest matches the artifacts
        working-directory: projects/akita-sc
        run: npm run release:manifest:check

      - name: SDK unit tests
        working-directory: projects/akita-sdk
        run: npm test

  test:
    name: Suite (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Use the Node.js version in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install algokit
        run: pipx install algokit

      - name: Start LocalNet
        run: algokit localnet start

      - name: Install from the lockfile
        run: npm ci

      # The suite runs against the committed artifacts; the build job proves they are current.
      - name: Run the suite
        working-directory: projects/akita-sc
        run: npx vitest run --shard=${{ matrix.shard }}/6
